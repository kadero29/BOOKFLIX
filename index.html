
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bookflix - Recommandations</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #141414; color: white; padding: 20px; }
    .questionnaire, .result { max-width: 800px; margin: auto; }
    h2 { color: #e50914; }
    .question { margin-bottom: 25px; }
    .question label { display: block; margin: 6px 0; }
    .button { padding: 10px 20px; background-color: #e50914; color: white; border: none; cursor: pointer; }
    .result-card { background: #222; margin-top: 20px; padding: 20px; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="questionnaire" id="questionnaire">
    <h1>📚 Bookflix – Questionnaire</h1>

    <div class="question">
      <h2>Quel genre préfères-tu lire ?</h2>
      <label><input type="radio" name="genre" value="Roman réaliste"> Roman réaliste</label>
      <label><input type="radio" name="genre" value="Science-fiction"> Science-fiction / Dystopie</label>
      <label><input type="radio" name="genre" value="Fantasy"> Fantasy</label>
      <label><input type="radio" name="genre" value="Historique"> Historique</label>
      <label><input type="radio" name="genre" value="Témoignage"> Témoignage / Autobiographie</label>
    </div>

    <div class="question">
      <h2>Quel est ton âge ?</h2>
      <label><input type="radio" name="age" value="11+"> 11-12 ans</label>
      <label><input type="radio" name="age" value="13+"> 13-14 ans</label>
      <label><input type="radio" name="age" value="15+"> 15 ans et plus</label>
    </div>

    <button class="button" onclick="generateResults()">Voir mes recommandations</button>
  </div>

  <div class="result" id="result" style="display:none;">
    <h2>📚 Recommandations Bookflix :</h2>
    <div id="resultsContainer"></div>
  </div>

  <script>
    let data = [];

    fetch("https://raw.githubusercontent.com/kadero29/BOOKFLIX/main/bookflix_base.json")
      .then(response => response.json())
      .then(json => { data = json; })
      .catch(error => console.error("Erreur JSON :", error));

    function generateResults() {
      const genre = document.querySelector('input[name="genre"]:checked')?.value;
      const age = document.querySelector('input[name="age"]:checked')?.value;

      if (!genre || !age) {
        alert("Merci de répondre à toutes les questions !");
        return;
      }

      const filtered = data.filter(book =>
        book.Genre?.toLowerCase().includes(genre.toLowerCase()) &&
        book["Âge conseillé"]?.includes(age)
      ).slice(0, 3);

      const container = document.getElementById("resultsContainer");
      container.innerHTML = "";

      filtered.forEach(book => {
        const div = document.createElement("div");
        div.classList.add("result-card");
        div.innerHTML = `<h3>${book.Titre}</h3><p><strong>Âge conseillé :</strong> ${book["Âge conseillé"]}</p><p>${book.Accroche}</p>`;
        container.appendChild(div);
      });

      document.getElementById("questionnaire").style.display = "none";
      document.getElementById("result").style.display = "block";
    }
  </script>
</body>
</html>
