<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOKFLIX</title>
  <style>
    @keyframes fadeInNetflix {
      0% { opacity: 0; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #141414;
      color: white;
      padding: 20px;
      font-size: 1.1em;
    }
    .banner {
      background-color: #000;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
    }
    .banner h1 {
      font-size: 3em;
      color: #e50914;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    .progress-bar {
      width: 100%;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 30px;
    }
    .progress {
      height: 10px;
      background: #e50914;
      width: 0%;
      transition: width 0.5s ease;
    }
    .questionnaire, .result {
      max-width: 800px;
      margin: auto;
    }
    .question {
      margin-bottom: 25px;
    }
    h2 {
      color: #e50914;
    }
    .question label {
      display: block;
      margin: 6px 0;
    }
    .button {
      padding: 12px 24px;
      background-color: #e50914;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 1.2em;
      margin: 20px auto;
      display: block;
    }
    .result-card {
      background: #1f1f1f;
      margin-top: 20px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(229, 9, 20, 0.4);
      animation: fadeInNetflix 0.8s ease forwards;
      opacity: 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      border: 2px solid #e50914;
      transition: transform 0.3s ease;
    }
    .result-card:hover {
      transform: scale(1.02);
      background-color: #292929;
    }
    .result-card h3 {
      color: #e50914;
      font-size: 1.5em;
      margin: 0;
    }
    .result-card p {
      margin: 0.3em 0;
      line-height: 1.4;
      color: #fff;
    }
    .return-button {
      margin-top: 30px;
      padding: 10px 20px;
      background-color: transparent;
      border: 2px solid #e50914;
      color: #e50914;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .return-button:hover {
      background-color: #e50914;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="banner">
    <h1>BOOKFLIX</h1>
  </div>
  <div class="progress-bar"><div class="progress" id="progress"></div></div>

  <div class="questionnaire" id="questionnaire"></div>

  <div class="result" id="result" style="display:none;">
    <h2>✨ Voici tes 3 lectures personnalisées :</h2>
    <div id="resultsContainer"></div>
    <button class="return-button" onclick="window.location.href='https://kadero29.github.io/BOOKFLIX/'">
      🏠 Retour à l’accueil
    </button>
  </div>
</body>
</html>
