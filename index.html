<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BOOKFLIX</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #141414;
      color: white;
      padding: 20px;
      font-size: 1.1em;
    }
    .banner {
      background-color: #000;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
    }
    .banner h1 {
      font-size: 3em;
      color: #e50914;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    .progress-bar {
      width: 100%;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 30px;
    }
    .progress {
      height: 10px;
      background: #e50914;
      width: 0%;
      transition: width 0.5s ease;
    }
    .questionnaire, .result {
      max-width: 800px;
      margin: auto;
    }
    .question {
      margin-bottom: 25px;
    }
    h2 {
      color: #e50914;
    }
    .question label {
      display: block;
      margin: 6px 0;
    }
    .button {
      padding: 12px 24px;
      background-color: #e50914;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 1.2em;
      margin: 20px auto;
      display: block;
    }
    .result-card {
      background: #222;
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
      animation: slideIn 1s ease forwards;
      opacity: 0;
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }
    .result-card img {
      width: 100px;
      height: auto;
      border-radius: 5px;
    }
    @keyframes slideIn {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .restart-button, .share-button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #444;
      color: white;
      border: none;
      cursor: pointer;
      display: block;
      font-size: 1em;
      margin-left: auto;
      margin-right: auto;
    }
    .share-button:hover, .restart-button:hover {
      background-color: #e50914;
    }
  </style>
</head>
<body>
  <div class="banner">
    <h1>BOOKFLIX</h1>
  </div>
  <div class="progress-bar"><div class="progress" id="progress"></div></div>

  <div class="questionnaire" id="questionnaire"></div>

  <div class="result" id="result" style="display:none;">
    <h2>✨ Voici tes 3 lectures personnalisées :</h2>
    <div id="resultsContainer"></div>
    <button class="restart-button" onclick="restartQuiz()">🔁 Refaire le questionnaire</button>
    <button class="share-button" onclick="shareResults()">📤 Partager</button>
    <button class="share-button" onclick="downloadResults()">⬇️ Télécharger</button>
  </div>

  <script>
    const questions = [
      {name: "ambiance", question: "1. Quelle ambiance de lecture cherches-tu ?", options: ["Détendue", "Intense", "Réfléchie", "Poétique", "Historique"]},
      {name: "personnage", question: "2. Quel type de personnage principal t’attire ?", options: ["Aventurier", "Sensible", "Rebelle", "Différent", "Fantastique"]},
      {name: "personnageAge", question: "3. Le personnage principal doit-il avoir ton âge ?", options: ["Oui", "Pas nécessairement", "Je préfère un adulte"]},
      {name: "genre", question: "4. Quel genre préfères-tu lire ?", options: ["Roman réaliste", "Science-fiction", "Fantasy", "Historique", "Témoignage"]},
      {name: "age", question: "5. Quel est ton âge ?", options: ["11-12 ans", "13-14 ans", "15 et plus"]},
      {name: "theme", question: "6. Quel thème t’attire le plus ?", options: ["Aventure", "Amitié", "Amour", "Résistance", "Identité"]},
      {name: "emotion", question: "7. Quelle émotion veux-tu ressentir ?", options: ["Suspense", "Émerveillement", "Joie", "Nostalgie"]},
      {name: "monde", question: "8. Préfères-tu des histoires situées dans :", options: ["Un monde réel", "Un monde imaginaire", "Dans un passé lointain"]},
      {name: "adaptation", question: "9. Veux-tu lire un livre adapté en film ou en série ?", options: ["Oui", "Peu importe", "Non"]},
      {name: "style", question: "10. Quel style d’écriture préfères-tu ?", options: ["Poétique et imagé", "Immersif comme un film", "Avec des dialogues vivants", "Littéraire et travaillé", "Original ou inattendu"]},
      {name: "emotionLecture", question: "11. Quelles émotions supplémentaires cherches-tu à ressentir ?", options: ["Frissons", "Rires", "Réflexion", "Évasion"]},
      {name: "format", question: "12. Préfères-tu des histoires :", options: ["Courtes et rythmées", "Longues et détaillées", "Découpées en chapitres courts", "Narrées à la première personne"]}
    ];

    const data = [];
    let currentQuestion = 0;
    const answers = {};

    fetch("https://raw.githubusercontent.com/kadero29/BOOKFLIX/main/bookflix_base_corrige.json")
      .then(r => r.json())
      .then(json => data.push(...json))
      .then(() => renderQuestion());

    function renderQuestion() {
      const container = document.getElementById("questionnaire");
      const q = questions[currentQuestion];
      const progress = document.getElementById("progress");
      progress.style.width = `${(currentQuestion / questions.length) * 100}%`;

      container.innerHTML = `<div class="question">
        <h2>${q.question}</h2>
        ${q.options.map(opt => `<label><input type="radio" name="${q.name}" value="${opt}"> ${opt}</label>`).join("")}
        <button class="button" onclick="nextQuestion()">Suivant</button>
      </div>`;
    }

    function nextQuestion() {
      const q = questions[currentQuestion];
      const selected = document.querySelector(`input[name='${q.name}']:checked`);
      if (!selected) return alert("Merci de choisir une réponse !");
      answers[q.name] = selected.value;
      currentQuestion++;
      if (currentQuestion < questions.length) renderQuestion();
      else showResults();
    }

    function showResults() {
      document.getElementById("questionnaire").style.display = "none";
      document.getElementById("result").style.display = "block";
      const scored = data.map(book => {
        let score = 0;
        for (let key in answers) {
          if (book[key]?.includes(answers[key])) score++;
        }
        return { ...book, score };
      });

      const top3 = scored.sort((a, b) => b.score - a.score).slice(0, 3);
      const container = document.getElementById("resultsContainer");
      container.innerHTML = "";
      top3.forEach(book => {
        const div = document.createElement("div");
        div.classList.add("result-card");
        div.innerHTML = `
          <img src="${book.Image || 'https://via.placeholder.com/100x150?text=Couverture'}" alt="Couverture de ${book.Titre}" />
          <div>
            <h3>${book.Titre}</h3>
            <p><strong>Âge conseillé :</strong> ${book["Âge conseillé"]}</p>
            <p><strong>Genre :</strong> ${book.Genre}</p>
            <p><strong>Accroche :</strong> ${book.Accroche}</p>
          </div>`;
        container.appendChild(div);
      });
    }

    function restartQuiz() {
      currentQuestion = 0;
      for (let key in answers) delete answers[key];
      document.getElementById("result").style.display = "none";
      document.getElementById("questionnaire").style.display = "block";
      renderQuestion();
    }

    function shareResults() {
      if (navigator.share) {
        navigator.share({
          title: 'Mes recommandations Bookflix',
          text: 'Viens découvrir quelles lectures me sont conseillées sur Bookflix !',
          url: window.location.href
        }).catch(err => console.error('Erreur de partage', err));
      } else {
        alert("Le partage n'est pas pris en charge sur ce navigateur.");
      }
    }

    function downloadResults() {
      const container = document.getElementById("resultsContainer");
      const textContent = container.innerText;
      const blob = new Blob(["Voici tes recommandations Bookflix :\n\n" + textContent], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "recommandations_bookflix.txt";
      link.click();
    }
  </script>
</body>
</html>
