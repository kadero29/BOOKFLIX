<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BOOKFLIX</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @keyframes fadeInNetflix {
      0% { opacity: 0; transform: scale(1.1); }
      100% { opacity: 1; transform: scale(1); }
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #141414;
      color: white;
      margin: 0;
      padding: 20px;
    }
    .banner {
      background-color: black;
      padding: 40px;
      text-align: center;
    }
    .banner h1 {
      color: #e50914;
      font-size: 3em;
      letter-spacing: 2px;
    }
    .progress-bar {
      width: 100%;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
      margin: 20px 0;
    }
    .progress {
      height: 10px;
      background: #e50914;
      width: 0%;
      transition: width 0.4s ease;
    }
    .questionnaire, .result {
      max-width: 800px;
      margin: auto;
    }
    .question {
      animation: fadeInNetflix 0.5s ease;
    }
    h2 {
      color: #e50914;
    }
    label {
      display: block;
      margin: 8px 0;
    }
    .button {
      background: #e50914;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1.1em;
      cursor: pointer;
      margin-top: 20px;
      display: inline-block;
    }
    .result-card {
      background: #222;
      border-left: 5px solid #e50914;
      padding: 20px;
      margin: 20px 0;
      border-radius: 10px;
      animation: fadeInNetflix 0.6s ease;
    }
    .result-card h3 {
      margin-top: 0;
      color: #e50914;
    }
    .action-buttons {
      text-align: center;
      margin-top: 30px;
    }
    .action-buttons .button {
      margin: 10px;
      background: transparent;
      border: 2px solid #e50914;
    }
    .action-buttons .button:hover {
      background: #e50914;
      color: white;
    }
  </style>
</head>
<body>
  <div class="banner">
    <h1>BOOKFLIX</h1>
  </div>
  <div class="progress-bar"><div class="progress" id="progress"></div></div>

  <div class="questionnaire" id="questionnaire"></div>

  <div class="result" id="result" style="display:none;">
    <h2>📚 Voici tes 3 lectures personnalisées :</h2>
    <div id="resultsContainer"></div>
    <div class="action-buttons">
      <button class="button" onclick="downloadPDF()">📥 Télécharger en PDF</button>
      <button class="button" onclick="location.reload()">🔁 Recommencer</button>
    </div>
  </div>

  <script>
    const questions = [
      {name: "ambiance", question: "1. Quelle ambiance de lecture cherches-tu ?", options: ["Détendue", "Intense", "Réfléchie", "Mystérieuse"]},
      {name: "personnage", question: "2. Quel type de personnage principal t’attire ?", options: ["Aventurier", "Sensible", "Rebelle", "Différent", "Fantastique"]},
      {name: "personnageAge", question: "3. Le personnage principal doit-il avoir ton âge ?", options: ["Oui", "Pas nécessairement", "Je préfère un adulte"]},
      {name: "genre", question: "4. Quel genre préfères-tu lire ?", options: ["Roman réaliste", "Science-fiction", "Fantasy", "Historique", "Témoignage"]},
      {name: "age", question: "5. Quel est ton âge ?", options: ["11-12 ans", "13-14 ans", "15 et plus"]},
      {name: "theme", question: "6. Quel thème t’attire le plus ?", options: ["Aventure", "Amitié", "Amour", "Résistance", "Identité"]},
      {name: "emotion", question: "7. Quelle émotion veux-tu ressentir ?", options: ["Suspense", "Émerveillement", "Joie", "Nostalgie"]},
      {name: "monde", question: "8. Préfères-tu des histoires situées dans :", options: ["Un monde réel", "Un monde imaginaire", "Dans un passé lointain"]},
      {name: "adaptation", question: "9. Veux-tu lire un livre adapté en film ou en série ?", options: ["Oui", "Peu importe", "Non"]},
      {name: "style", question: "10. Quel style d’écriture préfères-tu ?", options: ["Poétique et imagé", "Immersif comme un film", "Avec des dialogues vivants", "Littéraire et travaillé", "Original ou inattendu"]},
      {name: "emotionLecture", question: "11. Quelles émotions supplémentaires cherches-tu à ressentir ?", options: ["Frissons", "Rires", "Réflexion", "Évasion"]},
    ];

    let currentQuestion = 0;
    const answers = {};
    const data = [];

    fetch("https://raw.githubusercontent.com/kadero29/BOOKFLIX/main/bookflix_base_corrige.json")
      .then(r => r.json())
      .then(json => {
        data.push(...json);
        renderQuestion();
      });

    function renderQuestion() {
      const container = document.getElementById("questionnaire");
      const q = questions[currentQuestion];
      const progress = document.getElementById("progress");
      progress.style.width = `${(currentQuestion / questions.length) * 100}%`;
      container.innerHTML = `
        <div class="question">
          <h2>${q.question}</h2>
          ${q.options.map(opt => `<label><input type="radio" name="${q.name}" value="${opt}"> ${opt}</label>`).join("")}
          ${currentQuestion > 0 ? `<button class="button" onclick="prevQuestion()">⬅ Retour</button>` : ""}
          <button class="button" onclick="nextQuestion()">Suivant</button>
        </div>`;
    }

    function nextQuestion() {
      const q = questions[currentQuestion];
      const selected = document.querySelector(`input[name='${q.name}']:checked`);
      if (!selected) return alert("Merci de choisir une réponse !");
      answers[q.name] = selected.value;
      currentQuestion++;
      if (currentQuestion < questions.length) renderQuestion();
      else showResults();
    }

    function prevQuestion() {
      currentQuestion--;
      renderQuestion();
    }

    function showResults() {
      document.getElementById("questionnaire").style.display = "none";
      document.getElementById("result").style.display = "block";
      const results = data.map(book => {
        let score = 0;
        for (const key in answers) {
          if (book[key]?.includes(answers[key])) score++;
        }
        return { ...book, score };
      }).sort((a, b) => b.score - a.score).slice(0, 3);

      const container = document.getElementById("resultsContainer");
      container.innerHTML = results.map(book => `
        <div class="result-card">
          <h3>${book.Titre}</h3>
          <p><strong>Âge conseillé :</strong> ${book["Âge conseillé"]}</p>
          <p><strong>Genre :</strong> ${book.Genre}</p>
          <p><strong>Accroche :</strong> ${book.Accroche}</p>
        </div>`).join("");
    }

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const img = new Image();
      img.src = 'https://kadero29.github.io/BOOKFLIX/logo-bookflix.png';
      img.onload = function () {
        doc.addImage(img, 'PNG', 70, 10, 60, 20);
        let y = 40;
        doc.setFont("helvetica", "bold");
        doc.setFontSize(14);
        doc.text("Mes recommandations Bookflix", 20, y);
        y += 10;
        document.querySelectorAll(".result-card").forEach(card => {
          card.querySelectorAll("h3, p").forEach(el => {
            if (y > 270) {
              doc.addPage();
              y = 20;
            }
            doc.setFont("helvetica", el.tagName === "H3" ? "bold" : "normal");
            doc.text(el.innerText, 20, y);
            y += 8;
          });
          y += 4;
        });
        doc.save("bookflix_recommandations.pdf");
      };
    }
  </script>
</body>
</html>
